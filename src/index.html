<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ace 60 Switcher</title>
    <script type="module" src="/main.js" defer></script>

  <body>
    <div class="container">
      <h1>Ace 60 Switcher</h1>
      <p class="subtitle">Switch between MCHOSE profiles via hotkeys</p>
      
      <button id="importBtn" class="import-btn">Import Profile (.json)</button>
      
      <h2>Profiles</h2>
      <div id="profilesList" class="profiles-list">
        <p class="empty">No profiles imported yet</p>
      </div>
      
      <div class="info">
        <p><strong>VID:</strong> 0x41E4 (16868) | <strong>PID:</strong> 0x2113 (8451)</p>
        <p class="note">HID communication coming soon</p>
      </div>
    </div>
  </body>
